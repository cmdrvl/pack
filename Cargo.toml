[package]
name = "pack"
version = "0.8.0"
edition = "2021"
description = "Seal lockfiles, reports, rules, and registry artifacts into one immutable, self-verifiable evidence pack."
license = "MIT"

[features]
default = ["cli"]
cli = ["dep:chrono", "dep:clap", "dep:tempfile"]

[dependencies]
# Not called directly since bd-hh7 (hashing goes through cmdrvl-core); this pins the version that
# core builds against.
blake3 = "=1.8.2"
clap = { version = "4", features = ["derive"], optional = true }
# Pinned by exact rev. default-features = false: core's default turns on serde_json/float_roundtrip,
# which would change how this crate parses floats.
cmdrvl-core = { git = "https://github.com/cmdrvl/core", rev = "a3dad0b1af2eeb8036625b25f3d9ff94c3a1ef0e", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
tempfile = { version = "3", optional = true }

[lib]
name = "pack"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
spine-rules = { git = "https://github.com/cmdrvl/spine-rules" }

[[bin]]
name = "pack"
path = "src/main.rs"
required-features = ["cli"]
